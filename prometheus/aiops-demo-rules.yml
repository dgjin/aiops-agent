# AIOps Agent 告警规则集 v1（WP1 交付物）
# 说明：
#   - 本文件为「可自动修复」类告警的规则样例，统一携带 aiops_demo="true" 标签；
#     nl2sql-monitoring 栈的 Alertmanager 已配置子路由将携带该标签的告警转发至
#     AIOps 告警接入服务（aiops-agent/alert_webhook.py:8099，见 deploy/alertmanager.yml 接入点注释）；
#   - 接入状态（2026-10-04）：已挂载至「智能问数据分析系统」监控栈并生效——
#     副本位于该栈 deploy/aiops-demo-rules.yml，deploy/prometheus.yml 的 rule_files 与
#     docker-compose.monitoring.yml 的 prometheus.volumes 均已配置；
#     同栈 deploy/prometheus-alerts.yml 的 10 条业务规则已同步加 aiops_demo="true" 标签；
#     两类告警均经 Alertmanager 子路由直达告警接入服务（8099 → Temporal 自动流程）。
#   - 新环境接入步骤（此前未挂载时）：复制本文件到该栈 deploy/ 目录；在 prometheus.yml
#     rule_files 追加 - /etc/prometheus/aiops-demo-rules.yml；在 docker-compose.monitoring.yml
#     prometheus.volumes 追加同名挂载；docker-compose -f docker-compose.monitoring.yml up -d prometheus。
#   - 语法校验：docker exec nl2sql-monitoring-prometheus-1 promtool check rules /etc/prometheus/aiops-demo-rules.yml
#
# 规则设计对齐实施计划 WP1：阈值 + 环比基线；分组与抑制沿用该栈既有配置
# （route.group_by: [alertname, service] + inhibit_rules 防告警风暴）。

groups:
  - name: aiops-demo-infra
    rules:
      # 主机 CPU 高水位（阈值：>85% 持续 1 分钟）
      - alert: NodeCpuUsageHigh
        expr: 100 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 85
        for: 1m
        labels: { severity: critical, service: node, aiops_demo: "true" }
        annotations:
          summary: "主机 CPU 使用率超过 85%"
          description: "实例 {{ $labels.instance }} 近 5 分钟 CPU 使用率 {{ printf \"%.1f\" $value }}%，持续 1 分钟以上，可能影响其上全部服务。"

      # MySQL 可用连接数逼近耗尽（阈值：剩余 <20）
      - alert: MysqlConnectionsNearLimit
        expr: mysql_global_variables_max_connections - mysql_global_status_threads_connected < 20
        for: 2m
        labels: { severity: critical, service: mysql, aiops_demo: "true" }
        annotations:
          summary: "MySQL 可用连接数不足 20"
          description: "当前已用连接 {{ $labels.instance }} 逼近 max_connections 上限，新请求可能被拒绝，需排查连接泄漏或调大上限。"

      # Redis 内存使用率过高（阈值：>85%；未配置 maxmemory 时该序列被门槛过滤，不误报）
      - alert: RedisMemoryUsageHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes > 0.85)
            and redis_memory_max_bytes > 0
        for: 2m
        labels: { severity: warning, service: redis, aiops_demo: "true" }
        annotations:
          summary: "Redis 内存使用率超过 85%"
          description: "缓存层内存接近 maxmemory 上限，继续增长将触发逐出（eviction）导致命中率下降。"

  - name: aiops-demo-business
    rules:
      # 问数错误率环比突增（环比基线：与 1 小时前同窗口比较，突增 3 倍以上且绝对量有流量门槛）
      - alert: Nl2sqlErrorRateSpike
        expr: |
          (
            sum(rate(nl2sql_requests_total{status="ERROR"}[5m]))
              > 3 * sum(rate(nl2sql_requests_total{status="ERROR"}[5m] offset 1h))
          )
          and sum(rate(nl2sql_requests_total{status="ERROR"}[5m])) > 0.001
        for: 2m
        labels: { severity: critical, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "问数错误率环比突增 3 倍以上"
          description: "近 5 分钟 ERROR 速率较 1 小时前基线突增，常见于 LLM 引擎异常或数据源故障，优先检查依赖可用性。"
