# AIOps 闸门策略配置（设计方案第 5 节 / 附录 A）
# 策略即配置：工作流启动时加载快照，运行期不热修改，变更走版本升级。
release_gate:
  shadow_mode: false              # 运行档（production 必须显式声明本键）：false = 全链路（MR → 审批 → 公告 → 金丝雀发布）；true = 影子档（只建议不执行，测试通过后停止，不发 MR/审批/发布）
  triage:
    confidence_threshold: 0.8     # 闸门 1：根因置信度低于阈值转人工（设计方案 4.2）
    max_fix_retries: 2            # 补丁回炉重试上限（防 token/资源雪崩）
    # M3 组合放行判据：证据 OK、Schema 有效、代码根因、嫌疑文件可定位才放行；
    # 基础设施/配置/证书/DNS 等非代码根因走人工/Runbook，不生成代码补丁。
    composite_gate:
      enabled: true
      require_suspect_files: true
    # M3 模型路由：生产未在质量证据文件（holdout 门槛）中达标的模型一律转人工/排队，
    # 不静默降级；证据由 eval_fix.py --write-quality-bar 在门槛达标时生成。
    fix_routing:
      require_quality_bar: true
      quality_bar_path: ./data/model_quality_bar.json
      prefer_qoder_for_multi_file: true
  approval:
    timeout: 30m                  # 超时自动驳回（锁定）
    on_timeout: reject
    on_timeout_escalation: phone
    second_approval_dirs: [auth/**, payment/**, crypto/**]
  notify_window:
    countdown: 15m                # 用户弹窗后的部署延迟
    deploy_on_expiry: true
    allow_deploy_now: true
    allow_cancel: true
    new_patch_during_window:
      strategy: queue             # 仅排队（锁定）
      reset_timer: false
      merge_with_current: false
      queue_limit: 0              # 不设上限（锁定）
      next_cycle: auto
    feedback_circuit_breaker:
      enabled: false              # 不设熔断阈值（锁定）
    concurrency:
      max_active_deployments: 1
  canary:
    traffic_percent: 5
    observe_duration: 5m
    health_metrics: [error_rate, p99_latency]
    auto_rollback: true
  # M6 并发与背压：Worker 并发 + 资源信号量（进程内；多副本须集中限流）
  capacity:
    worker_activities: 10           # staging 初始值，按压测调整
    worker_local_activities: 4
    local_llm: 1                    # 本地模型同时只跑一个
    qoder: 1
    sandbox: 2
    release: 1                      # 锁定：同一时刻仅一个发布
    queue_timeout: 0s               # 0 = 无限等待（排队不设上限）
    distributed_limits: false       # true 表示已接入集中限流

# Git 平台接入（可选，MR 真实创建；缺省不启用 → MR 活动返回 recorded 桩）
# 令牌经环境变量 AIOPS_GIT_TOKEN 注入（生产对应 K8s Secret 名称 token_secret）
# git:
#   repo_url: "https://gitlab.example.com/ops/demo-app"   # 支持 GitLab / GitHub / Gitee
#   token_secret: "aiops-git-token"
#   default_branch: "main"
#   mr_labels: [aiops, auto-fix]
