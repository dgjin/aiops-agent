# AIOps 敏感配置（示例文件：全部值均为 REPLACE_ME 占位，apply 前必须替换）
#
# 用法（二选一）：
#   1. 直接编辑本文件替换 REPLACE_ME 后 kubectl apply -f deploy/k8s/secret.example.yaml
#   2. 推荐：不改文件，用命令行生成（密钥不落盘）：
#        kubectl -n aiops-system create secret generic aiops-secrets \
#          --from-literal=AIOPS_DATABASE_URL='mysql+pymysql://aiops:<密码>@aiops-mysql:3306/aiops?charset=utf8mb4' \
#          --from-literal=MYSQL_PASSWORD='<密码>' --from-literal=MYSQL_ROOT_PASSWORD='<root密码>' \
#          --from-literal=AIOPS_CONSOLE_AUTH_TOKENS='{"<令牌>":{"user":"ops01","role":"admin"}}' \
#          --from-literal=AIOPS_GIT_TOKEN='<GitLab/GitHub/Gitee 访问令牌>' \
#          --from-literal=AIOPS_QODER_TOKEN='<Qoder 令牌>' \
#          --dry-run=client -o yaml | kubectl apply -f -
#   生产建议叠加 External Secrets Operator（对接 Vault / 云厂商密钥服务），见优化方案 3.3。
#
# 注意：本文件已纳入版本库（示例），永远不要在此写入真实密钥。
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops-system
type: Opaque
stringData:
  # MySQL 连接串（production 模式必填；aiops 用户由 mysql.yaml 的 initdb 授权 temporal 库）
  AIOPS_DATABASE_URL: "mysql+pymysql://aiops:REPLACE_ME@aiops-mysql:3306/aiops?charset=utf8mb4"
  # MySQL 容器初始化口令（mysql.yaml StatefulSet 引用）
  MYSQL_PASSWORD: "REPLACE_ME"
  MYSQL_ROOT_PASSWORD: "REPLACE_ME"
  # 控制台令牌注册表（JSON：{"<token>":{"user":"...","role":"viewer|operator|admin"}}）
  AIOPS_CONSOLE_AUTH_TOKENS: '{"REPLACE_ME":{"user":"ops01","role":"admin"}}'
  # Git 平台访问令牌（MR/PR 真实创建，见 aiops_agent/git_integration.py；留空降级为桩结果）
  AIOPS_GIT_TOKEN: "REPLACE_ME"
  # Qoder 修复引擎令牌（AIOPS_FIX_PROVIDER=qoder 时使用）
  AIOPS_QODER_TOKEN: "REPLACE_ME"
