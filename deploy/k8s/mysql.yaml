# MySQL 8.0（生产持久化：业务库 aiops + Temporal 后端 temporal / temporal_visibility）
#
# 说明：
#   - StatefulSet + volumeClaimTemplate（10Gi，按需调整 storageClassName）；
#   - initdb 脚本创建 Temporal 两个库并授权 aiops 用户（temporalio/auto-setup 需要建表权限）；
#   - 生产可替换为云 RDS：保留 aiops/temporal 库与账号授权，删除本文件其余资源即可。
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-mysql-config
  namespace: aiops-system
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    # 单实例默认值：按机器规格调整（建议为容器内存的 50%~70%）
    innodb_buffer_pool_size=512M
    max_connections=300
    # Temporal 工作流历史写入较频繁，降低刷盘抖动
    innodb_flush_log_at_trx_commit=2
    [client]
    default-character-set=utf8mb4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-mysql-initdb
  namespace: aiops-system
data:
  init.sql: |
    -- Temporal 后端数据库（auto-setup 将以 aiops 用户建表，故需提前授权）
    CREATE DATABASE IF NOT EXISTS temporal CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS temporal_visibility CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    GRANT ALL PRIVILEGES ON temporal.* TO 'aiops'@'%';
    GRANT ALL PRIVILEGES ON temporal_visibility.* TO 'aiops'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-mysql
  namespace: aiops-system
  labels:
    app: aiops-mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: aiops-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiops-mysql
  namespace: aiops-system
spec:
  serviceName: aiops-mysql
  replicas: 1
  selector:
    matchLabels:
      app: aiops-mysql
  template:
    metadata:
      labels:
        app: aiops-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: aiops
            - name: MYSQL_USER
              value: aiops
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: MYSQL_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: MYSQL_ROOT_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: config
          configMap:
            name: aiops-mysql-config
        - name: initdb
          configMap:
            name: aiops-mysql-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <按集群存储类填写；不填用默认类>
        resources:
          requests:
            storage: 10Gi
