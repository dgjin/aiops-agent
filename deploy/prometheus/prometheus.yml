# Prometheus 配置（docker compose --profile obs 使用）
#
# 采集目标：BFF（宿主机 :8600/metrics）与 worker（宿主机 :9090/metrics）——
# BFF/worker 以本机进程形态运行（scripts/demo-up.sh），容器经 host.docker.internal 访问；
# K8s 部署使用 deploy/k8s/servicemonitor.yaml（Prometheus Operator 自动发现）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/aiops-alerts.yml

scrape_configs:
  - job_name: aiops-bff
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8600"]

  - job_name: aiops-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
