# 预生产敏感配置（示例文件：全部值为 REPLACE_ME，apply 前必须替换）
#
# 推荐用法（密钥不落盘）：
#   kubectl -n aiops-staging create secret generic aiops-secrets \
#     --from-literal=AIOPS_DATABASE_URL='mysql+pymysql://aiops:<密码>@<独立MySQL地址>:3306/aiops?charset=utf8mb4' \
#     --from-literal=AIOPS_CONSOLE_AUTH_TOKENS='{"<令牌>":{"user":"ops01","role":"admin"}}' \
#     --from-literal=AIOPS_ARGOCD_TOKEN='<ArgoCD API 令牌>' \
#     --from-literal=AIOPS_GIT_TOKEN='<Git 平台令牌>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 注意：
#   - 沙箱工作区 Secret（<job>-workspace）由执行器动态创建并删除，不要手工预置；
#   - 本文件已入库，永远不要写入真实密钥；生产建议接 External Secrets / Vault。
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops-staging
type: Opaque
stringData:
  # 独立预生产库（不得复用生产库或本机 demo 库）
  AIOPS_DATABASE_URL: "mysql+pymysql://aiops:REPLACE_ME@mysql.staging.internal:3306/aiops?charset=utf8mb4"
  # 控制台令牌注册表（JSON）
  AIOPS_CONSOLE_AUTH_TOKENS: '{"REPLACE_ME":{"user":"ops01","role":"admin"}}'
  # ArgoCD API 令牌（AIOPS_ARGOCD_URL 配置后发布走集群路径）
  AIOPS_ARGOCD_TOKEN: "REPLACE_ME"
  # Git 平台令牌（MR/PR 真实创建）
  AIOPS_GIT_TOKEN: "REPLACE_ME"
  # Qoder 修复引擎令牌（AIOPS_FIX_PROVIDER=qoder 时使用）
  AIOPS_QODER_TOKEN: "REPLACE_ME"
