# AIOps Agent 合入门禁（P0-2）
#
# 三条门禁均为本地已验证口径（与 README「开发与测试」一致）：
#   1. 单测：python -m unittest discover -s tests -t .   —— 必须带 -t .：
#      触发 tests/__init__.py 的 demo 隔离钩子；缺 -t . 时测试以顶层模块导入、
#      生产档下会直连真实数据库（CI 无 .env，仍显式设 demo 双保险）。
#   2. 前端：npm ci && npm run build（tsc --noEmit && vite build）。
#   3. SAST：bash scripts/security-scan.sh（Bandit Medium+，HIGH 必须为 0）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: 单元测试（unittest / demo 档）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIOPS_MODE: demo
      AIOPS_POLICY_PATH: ./demo-policy.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行单元测试（必须带 -t .）
        run: python -m unittest discover -s tests -t . -v

  web-build:
    name: 前端构建（tsc + vite）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci
      - name: 构建
        working-directory: web
        run: npm run build

  security-scan:
    name: Bandit SAST（Medium+，HIGH=0）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Bandit
        run: pip install bandit
      - name: 执行 SAST 扫描
        run: bash scripts/security-scan.sh
