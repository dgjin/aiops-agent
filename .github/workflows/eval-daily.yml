# 每日 / 模型变更完整评测（M3）。
#
# PR 阶段只跑确定性门禁（ci.yml 的 eval-gate，不调用模型）；
# 真实模型评测耗时长且需要 Ollama + 大模型，因此固定跑在自托管评测机上：
#   - runner 标签：self-hosted, aiops-eval
#   - 机器要求：Ollama 已启动（默认 127.0.0.1:11434），已 pull 评测模型
#     （默认 qwen3.8:27b-mlx；小模型可显式 dispatch 覆盖）
#   - 若 Ollama 或模型缺失，本工作流会显式失败并给出修复提示，绝不静默跳过
# 质量门槛证据（data/model_quality_bar.json）不在此自动写入：
# holdout 全绿后需人工执行 --write-quality-bar 并随报告一起提交评审。
name: Eval Daily

on:
  schedule:
    - cron: "0 18 * * *" # 每日 UTC 18:00（北京时间 02:00）
  workflow_dispatch:
    inputs:
      model:
        description: "评测模型（需已在 runner 上 pull）"
        required: false
        default: ""
      split:
        description: "数据切分"
        required: false
        type: choice
        options: [holdout, dev, all]
        default: holdout
  push:
    branches: [main]
    paths:
      - "aiops_agent/triage.py"
      - "aiops_agent/fix_agent.py"
      - "aiops_agent/model_routing.py"
      - "aiops_agent/gate_decision.py"
      - "eval_triage.py"
      - "eval_fix.py"
      - "data/triage_eval_samples.json"
      - "data/fix_eval_samples.json"
      - "data/fix_eval_abstain_samples.json"

permissions:
  contents: read

concurrency:
  group: eval-daily
  cancel-in-progress: false

jobs:
  model-eval:
    name: Triage + fix holdout eval (Ollama)
    runs-on: [self-hosted, aiops-eval]
    timeout-minutes: 240
    env:
      PYTHON_DOTENV_DISABLED: "1"
      AIOPS_MODE: demo
      OLLAMA_HOST: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create venv and install hash locks
        run: |
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes -r requirements-build.lock
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --no-build-isolation --only-binary=:all: --no-binary=drain3 -r requirements-ci.lock
      - name: Resolve and validate inputs
        env:
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_SPLIT: ${{ inputs.split }}
        run: |
          model="${INPUT_MODEL:-qwen3.8:27b-mlx}"
          split="${INPUT_SPLIT:-holdout}"
          case "$model" in
            *[!A-Za-z0-9._:/-]*) echo "非法模型名: $model"; exit 1 ;;
          esac
          case "$split" in
            holdout|dev|all) ;;
            *) echo "非法切分: $split"; exit 1 ;;
          esac
          {
            echo "EVAL_MODEL=$model"
            echo "EVAL_SPLIT=$split"
          } >> "$GITHUB_ENV"
      - name: Preflight（Ollama 与模型必须就绪）
        run: |
          .venv/bin/python - "$EVAL_MODEL" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          model = sys.argv[1]
          host = os.environ.get("OLLAMA_HOST", "http://127.0.0.1:11434")
          try:
              with urllib.request.urlopen(f"{host}/api/tags", timeout=10) as response:
                  tags = json.load(response)
          except Exception as exc:  # noqa: BLE001 - 明确失败原因即可
              raise SystemExit(f"Ollama 不可达（{host}）：{exc}；评测机需先启动 ollama serve")
          names = {item.get("name") for item in tags.get("models", [])}
          if model not in names:
              raise SystemExit(f"评测模型缺失：{model}；请在评测机执行 ollama pull {model}")
          print(f"Ollama 就绪，模型 {model} 可用")
          PY
      - name: Triage holdout eval（组合判据 + 安全回归）
        run: .venv/bin/python eval_triage.py --split "$EVAL_SPLIT" --model "$EVAL_MODEL" --check
      - name: Fix holdout eval（真实沙箱 + 弃权路由）
        run: .venv/bin/python eval_fix.py --split "$EVAL_SPLIT" --model "$EVAL_MODEL" --retries 2 --check
      - name: Deterministic dataset gate（与 PR 同口径）
        run: .venv/bin/python scripts/eval_gate.py --json "$RUNNER_TEMP/eval-gate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            data/triage_eval_report.json
            data/fix_eval_report.json
            ${{ runner.temp }}/eval-gate.json
          if-no-files-found: warn
          retention-days: 30
